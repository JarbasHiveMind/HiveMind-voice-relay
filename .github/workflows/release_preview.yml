name: Release Preview

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release_preview:
    uses: OpenVoiceOS/gh-automations/.github/workflows/release-preview.yml@dev
    with:
      version_file: 'hivemind_voice_relay/version.py'
      package_name: 'HiveMind-voice-relay'
