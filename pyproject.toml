[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-voice-relay"
description = "Hivemind Voice Relay"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "hivescope==0.3.0a3"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-voice-relay"

[project.scripts]
hivemind-voice-relay = "hivemind_voice_relay.__main__:connect"

[tool.setuptools]
packages = ["hivemind_voice_relay"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_voice_relay.version.__version__" }
dependencies = { file = ["requirements.txt"] }
