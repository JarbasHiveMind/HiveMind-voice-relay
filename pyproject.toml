[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-voice-relay"
description = "Hivemind Voice Relay — local wakeword, remote STT/TTS via hivemind-core"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # HiveMind transport + identity. 1.0.16a1 is the current bus-client 1.0.x
    # line (it requires ovos-bus-client>=2.0.0a3).
    "hivemind-bus-client>=1.0.16a1",
    # Pin the bus-client 2.x floor explicitly so the whole stack resolves on
    # 2.x (no --pre needed: a prerelease floor pin resolves it).
    "ovos-bus-client>=2.9.1a1",
    # Server-side TTS playback service. 1.3.0a1 dropped the old
    # ovos-bus-client<2.0.0 cap (now <3.0.0), unblocking the 2.x move.
    "ovos-audio>=1.3.0a1",
    # opm.* entry-point groups need >=2.1.0; the 2.x agents want the 2.11 alphas.
    "ovos-plugin-manager>=2.11.6a1",
    # Local mic/VAD/wakeword loop. 0.3.1a1 also allows ovos-bus-client<3.0.0.
    "ovos-simple-listener>=0.3.1a1",
    "ovos-microphone-plugin-alsa",
    "ovos-vad-plugin-silero",
    # STT/TTS plugin templates for OVOS config compatibility; the relay itself
    # supplies its own remote-backed STT (HiveMindSTT) and server-side TTS
    # playback, so these act as offline fallbacks only.
    "ovos-stt-plugin-server",
    "ovos-tts-plugin-server",
    "click",
    "pybase64",
]

[project.optional-dependencies]
# End-to-end tests: spin a real hivemind-core master in-process and the real
# relay client over a real HiveMessageBusClient via the hivescope harness.
# All pins are prerelease floors (>=X.Ya1) so pip/uv resolve them on the 2.x
# stack without --pre.
e2e = [
    "pytest",
    "pytest-timeout",
    "hivescope>=0.8.0a1",
    "hivemind-core>=4.13.18a1",
    "hivemind-ovos-agent-plugin>=0.3.10a1",
    "hivemind-plugin-manager>=0.9.0a7",
]
# Alias for the shared coverage/build workflows that install `.[test]`.
test = [
    "HiveMind-voice-relay[e2e]",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-voice-relay"

[project.scripts]
hivemind-voice-relay = "hivemind_voice_relay.__main__:connect"

[tool.setuptools]
packages = ["hivemind_voice_relay"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_voice_relay.version.__version__" }
